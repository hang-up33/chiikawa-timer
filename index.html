<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちいかわ パジャマパーティーズタイマー</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1 id="appTitle">パジャマパーティーズタイマー</h1>

    <div class="time-display" id="timeDisplay">00:00:00</div>

    <div class="time-inputs" id="timeInputs">
      <div class="time-field">
        <input type="number" id="hoursInput" min="0" max="24" value="0" inputmode="numeric">
        <label for="hoursInput">時間</label>
      </div>
      <div class="time-field">
        <input type="number" id="minutesInput" min="0" max="59" value="0" inputmode="numeric">
        <label for="minutesInput">分</label>
      </div>
      <div class="time-field">
        <input type="number" id="secondsInput" min="0" max="59" value="0" inputmode="numeric">
        <label for="secondsInput">秒</label>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start" disabled>スタート</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>一時停止</button>
      <button id="resetBtn" class="btn btn-reset" disabled>リセット</button>
    </div>

    <p class="status" id="statusText" role="status" aria-live="polite">動画を読み込み中です...</p>

    <button id="playMusicBtn" class="btn btn-start" hidden>🎵 音楽を再生する</button>

    <div class="track-select">
      <label for="trackSelect">🎵 曲をえらぶ</label>
      <select id="trackSelect"></select>
    </div>

    <div class="player-wrap">
      <div id="player"></div>
      <p class="player-caption" id="playerCaption">再生中:「パジャマパーティーズのうた」(公式配信)</p>
    </div>

    <p class="credit">
      本アプリは楽曲ファイルを配布していません。再生はYouTubeの公式配信元による埋め込みプレーヤーを利用しています。
      「パジャマパーティーズのうた」「島のうた (セイレーンver.)」©ちいかわ製作委員会<br>
      終了音:『映画ちいかわ 人魚の島のひみつ』WEBCM うさぎラップ篇(東宝MOVIEチャンネル公式)
    </p>
  </div>

  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
